name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check --config backend/ruff.toml backend/

  backend-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: backend
      - name: Run tests with coverage
        run: python -m pytest -v --cov=app --cov-report=term-missing --cov-report=json --junitxml=junit.xml
        working-directory: backend
      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const cov = JSON.parse(fs.readFileSync('backend/coverage.json', 'utf8'));
            const totalPct = cov.totals.percent_covered.toFixed(1);

            const rows = Object.entries(cov.files)
              .filter(([, d]) => d.summary.num_statements > 0 && d.summary.percent_covered > 0)
              .sort(([a], [b]) => a.localeCompare(b))
              .map(([path, d]) => {
                const s = d.summary;
                return `| \`${path}\` | ${s.num_statements} | ${s.missing_lines} | ${s.percent_covered.toFixed(1)}% |`;
              });
            const table = rows.length
              ? ['| File | Statements | Missed | Coverage |', '|---|---|---|---|', ...rows].join('\n')
              : '_No files with partial/full coverage yet._';

            const junit = fs.readFileSync('backend/junit.xml', 'utf8');
            const attr = name => (junit.match(new RegExp(`${name}="([^"]+)"`)) || [, '?'])[1];
            const tests = attr('tests');
            const failures = attr('failures');
            const errors = attr('errors');
            const skipped = attr('skipped');
            const time = attr('time');

            const marker = '<!-- backend-coverage-comment -->';
            const summary = `**Backend test coverage: ${totalPct}%** of \`app/\` — ${tests} tests, ${failures} failed, ${errors} errors, ${skipped} skipped (${parseFloat(time).toFixed(1)}s)`;
            const footer = '_Only files with any coverage are listed — most of `app/` still has zero tests. Full report in the job logs._';
            const body = [marker, summary, '', table, '', footer].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  backend-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: caminoamiboda
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/caminoamiboda
    steps:
      - uses: actions/checkout@v4
      # weasyprint (imported transitively via quotes/owner_settlements/timelines
      # routers) needs these at import time, same as backend/Dockerfile.
      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libpangocairo-1.0-0 \
            libcairo2 \
            libgdk-pixbuf-xlib-2.0-0 \
            libffi-dev \
            shared-mime-info
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: python -c "import app.main"
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend

  # Creates the Sentry release object (commits, finalize, deploy record) for
  # the backend on every real push to main — Render does the actual deploy
  # separately and picks up the same commit SHA as the release name via
  # RENDER_GIT_COMMIT (see backend/app/main.py), so this just has to run
  # somewhere close to that deploy, not literally before it. Skipped on PRs
  # on purpose: we don't want a release object for commits that never ship.
  # No-ops silently (not a failed build) if SENTRY_AUTH_TOKEN isn't set as a
  # repo secret yet.
  backend-sentry-release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend-lint, backend-test, backend-migrations]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create Sentry release (backend)
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: camino-a-mi-boda
          SENTRY_PROJECT: camino-boda-backend
        with:
          environment: production
          release: ${{ github.sha }}

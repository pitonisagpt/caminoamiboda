<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Camino a mi Boda</title>
    <!-- No static <meta name="description"> here on purpose (found while
         building the per-vehicle SEO pages): react-helmet-async can only
         replace/dedupe a <meta> tag it rendered itself — a tag already
         baked into this static HTML is invisible to it, so a per-page
         <Helmet><meta name="description" .../></Helmet> (catalog, blog,
         each vehicle page, etc.) ended up APPENDING a second description
         tag instead of overriding this one; document.querySelector (and
         real crawlers) picked up whichever tag came first, i.e. always
         this generic one, never the per-page override. <title> doesn't
         have this problem — the DOM only ever allows one <title> node, so
         Helmet just overwrites document.title's value directly. Fixed by
         moving the sitewide default description into a root <Helmet> in
         PublicLayout.tsx instead (still the same generic text as before),
         so every page's own description is Helmet-managed from the start
         and later Helmet instances correctly replace it, not duplicate
         it. Non-JS clients (no SSR here) lose this one meta tag as a
         result — the <noscript> block below still gives them the same
         text as real visible content, which is what actually matters for
         them. -->


    <!-- Google Tag Manager — commented out on purpose, no GTM account
         exists yet (SEO/GEO/marketing checklist, see
         docs/desarrollo/seo-geo-marketing-checklist.md). To activate:
         1) create a container at tagmanager.google.com (free)
         2) replace BOTH "GTM-XXXXXXX" below (this one and the matching
            <noscript> block right after <body> further down) with the
            real container ID
         3) uncomment both blocks
         GTM IDs are not secret — every site using GTM has them in its
         public page source — so hardcoding the real ID directly here is
         fine, no env var needed. Once this is live, Meta Pixel/Google
         Ads/TikTok Pixel are added INSIDE the GTM web UI as tags, with NO
         further changes to this file. -->
    <!--
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-XXXXXXX');</script>
    -->
    <!-- End Google Tag Manager -->

    <!-- Static, generic Open Graph / Twitter Card tags — served as-is for
         every page. /catalogo?vehiculo=<id> gets a MORE SPECIFIC per-vehicle
         override of the same properties, but only for known link-preview-bot
         User-Agents (see worker.ts, which removes these before appending its
         own). Deliberately no og:url here: this same file is served for
         every route, so a hardcoded URL would be wrong everywhere except
         "/" — omitting it lets crawlers fall back to the actual request
         URL, which is correct on every page. -->
    <meta property="og:site_name" content="Camino a mi Boda" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Camino a mi Boda" />
    <meta property="og:description" content="Alquiler de autos clásicos, vintage y modernos para bodas y eventos especiales en Medellín y el Oriente Antioqueño. Reserva tu vehículo con conductor." />
    <meta property="og:image" content="https://caminoamiboda.com/favicon.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Camino a mi Boda" />
    <meta name="twitter:description" content="Alquiler de autos clásicos, vintage y modernos para bodas y eventos especiales en Medellín y el Oriente Antioqueño. Reserva tu vehículo con conductor." />
    <meta name="twitter:image" content="https://caminoamiboda.com/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&family=Montserrat:wght@400;500;600;700;900&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Google Tag Manager (noscript) — commented out, matching the head
         snippet above; see that comment for activation steps. -->
    <!--
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-XXXXXXX"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    -->
    <!-- End Google Tag Manager (noscript) -->
    <div id="root"></div>
    <!-- Visible fallback for any crawler/verifier that fetches this page
         without executing JavaScript — the app itself renders entirely
         client-side into #root above, so without this, such a crawler
         would see an empty body with no text describing what the site/
         app is for. -->
    <noscript>
      <h1>Camino a mi Boda</h1>
      <p>
        Camino a mi Boda es una plataforma de gestión operativa para
        alquiler de vehículos clásicos, vintage y modernos con conductor,
        para bodas y eventos especiales en Medellín y el Oriente
        Antioqueño, Colombia. Los clientes pueden consultar el catálogo de
        vehículos y reservar; nuestro equipo la usa para coordinar
        reservas, logística de eventos y calendario.
      </p>
      <p>Activa JavaScript para usar la aplicación completa.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
